# Temporary: adds native blocked-by edges between the #1343 sub-issues. Remove before merging.
name: Link #1343 blockers

on:
  push:
    branches: [ccr-773117c6-bnhnhn]
    paths: ['.github/workflows/link-1343-blockers.yml']

permissions:
  issues: write

jobs:
  link:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          set -e
          # child:blocker-db-id
          for edge in 1386:6250224561 1387:6250227849 1388:6250227849 1389:6250231275 1390:6250231275 1390:6250233826 1391:6250236902; do
            child=${edge%%:*}; blocker=${edge##*:}
            gh api --method POST "repos/${{ github.repository }}/issues/$child/dependencies/blocked_by" -F issue_id=$blocker --jq '.number' || echo "edge $edge failed"
          done
          for n in 1385 1386 1387 1388 1389 1390 1391; do
            echo "#$n blocked_by: $(gh api repos/${{ github.repository }}/issues/$n --jq '.issue_dependencies_summary.blocked_by')"
          done
