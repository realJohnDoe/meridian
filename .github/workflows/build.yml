name: Build & Test

on:
  workflow_call:

# Only contents: read needed here — upload-pages-artifact is just a
# compressed upload-artifact; deploy-pages (which needs pages: write
# and id-token: write) lives in the deploy workflow, not here.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      # build first: it regenerates src/routeTree.gen.ts (gitignored, produced
      # by the TanStack Router vite plugin). Type-aware lint rules need it —
      # running lint first left Route.useSearch()/useParams() unresolved on a
      # fresh checkout, causing spurious no-unsafe-* failures. The same build also
      # writes worker/worker-configuration.d.ts (gitignored, from wrangler.toml) via
      # the worker's pretypecheck; without it Request/Response/Env resolve to `any`.
      - run: pnpm run build
      # Also runs `lint:deps` (dependency-cruiser), which needs the same
      # generated routeTree.gen.ts the type-aware rules do — it is part of the
      # module graph. ESLint enforces the per-file import boundaries; this is
      # what catches an import *cycle*, which no single file is guilty of.
      - run: pnpm run lint
      - run: pnpm run test:coverage
      - run: pnpm run knip
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  e2e:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only dist/ is needed here; the type checks in `pnpm run build` already
      # run in the job above.
      - run: pnpm exec vite build
      # Layout regressions are invisible to every other gate here: all of src/
      # tests under jsdom, which has no layout engine and therefore no opinion
      # about heights, scrolling, or where anything lands on screen — see
      # e2e/layout-smoke.spec.ts. Contrast is a second, unrelated thing only a
      # real browser can see — see e2e/contrast-sweep.spec.ts's doc comment for
      # why pixel-sampling, and why axe-core alone can't do it; it's ratcheted
      # per (theme, route) rather than gated as a hard pass/fail, so a
      # regression in one combo can't hide behind an improvement in another.
      # Both specs serve the dist/ that `pnpm run build` produces, through the
      # same `webServer` in playwright.config.ts. Its own job so the slowest
      # two steps (unit coverage and this) run side by side instead of in
      # series. `--only-shell`: headless runs only use the headless shell.
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm run test:e2e
