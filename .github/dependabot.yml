version: 2
updates:
  - package-ecosystem: npm
    directories: ['/', '/worker'] # root package and the worker workspace package
    schedule:
      interval: weekly
    # Matches pnpm-workspace.yaml `minimumReleaseAge: 1440` (24 h).
    cooldown:
      default-days: 1
    ignore:
      # TypeScript is pinned below 7 while typescript-eslint refuses TS 7;
      # see "TypeScript pinned to 6.0.x" in CLAUDE.md.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]
