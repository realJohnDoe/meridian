# pnpm 11+ project settings

packages:
  - '.'
  - 'worker'

# ── Supply-chain protection ───────────────────────────────────────────────────
#
# minimumReleaseAge (minutes): pnpm refuses to install any package version
# published less than N minutes ago. The pnpm 11 default is 1440 (24 h).
# 1440 min = 24 h — gives the ecosystem time to flag hijacked releases while
# still allowing the esbuild security patch (GHSA-gv7w-rqvm-qjhr) to install.
minimumReleaseAge: 1440

# ── Dependency overrides ───────────────────────────────────────────────────────
# Force patched versions of vulnerable transitive dependencies.
# esbuild <0.28.1 has GHSA-gv7w-rqvm-qjhr (missing binary integrity in Deno
# module, RCE via NPM_CONFIG_REGISTRY). All paths run through vite.
# brace-expansion has GHSA-3jxr-9vmj-r5cp (DoS via exponential-time expansion
# of consecutive non-expanding {} groups) and GHSA-mh99-v99m-4gvg (DoS via
# unbounded expansion length, <=5.0.7, patched >=5.0.8). GHSA-rgw5-rvv9-x895
# (DoS via unbounded intermediate arrays, bypassing the GHSA-mh99 mitigation,
# <5.0.9, patched >=5.0.9) supersedes that floor. Pulled in transitively
# (dev-only, via vite-plugin-pwa and the eslint toolchain) at three
# vulnerable major lines (1.x, 2.x, 5.x) — only the 5.x line ever got a
# patch, so every consumer is forced onto it regardless of the major it
# originally requested. brace-expansion's CJS/ESM API has stayed stable
# across majors, so this is safe for these dev-only consumers.
# fast-uri <3.1.4 has GHSA-v2hh-gcrm-f6hx (host confusion via literal backslash
# authority delimiter) and <3.1.3 has GHSA-4c8g-83qw-93j6 (host confusion via
# failed IDN canonicalization). The unbounded >=3.1.4 floor let the resolver
# jump onto the 4.x line, which reintroduced the backslash-authority host
# confusion as GHSA-7p8r-x3mc-p8w7 (>=4.0.0 <4.1.2, patched >=4.1.2); the
# floor is now pinned past that too. Pulled in transitively (dev-only) via
# ajv, itself nested inside vite-plugin-pwa's workbox-build dependency.
# sharp <0.35.0 inherits libvips CVEs (CVE-2026-33327/33328/35590/35591).
# Also pulled in transitively (dev-only) via wrangler's miniflare dependency.
# undici <7.29.0 has GHSA-4cwx-7wf7-3272 (cross-user info disclosure and
# parse-time crash via degenerate private cache-control directives). Pulled
# in transitively (dev-only) via jsdom (vitest/coverage-v8's DOM env), which
# `require()`s undici's internal lib/handler/{wrap,unwrap}-handler.js paths —
# those moved in undici 8, so the floor is capped below 8.0.0 to avoid a
# MODULE_NOT_FOUND at jsdom import time; revisit once jsdom ships a release
# built against undici 8.
overrides:
  esbuild: ">=0.28.1"
  brace-expansion: ">=5.0.9"
  fast-uri: ">=4.1.2"
  sharp: ">=0.35.0"
  undici: ">=7.29.0 <8.0.0"

# allowBuilds: explicit allowlist for packages permitted to run install-time
# build scripts. Only add packages here after reviewing what the script does.
# esbuild  – compiles its Go-based JS bundler binary; required for Vite
# sharp    – compiles its libvips native image-processing binary; required for PWA icon gen
# workerd  – downloads Cloudflare's official Workers runtime binary; required for `wrangler dev`/`deploy`
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
