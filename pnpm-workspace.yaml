# pnpm 11+ project settings

packages:
  - '.'
  - 'worker'

# ── Supply-chain protection ───────────────────────────────────────────────────
#
# minimumReleaseAge (minutes): pnpm refuses to install any package version
# published less than N minutes ago. The pnpm 11 default is 1440 (24 h).
# 1440 min = 24 h — gives the ecosystem time to flag hijacked releases while
# still allowing the esbuild security patch (GHSA-gv7w-rqvm-qjhr) to install.
minimumReleaseAge: 1440

# ── Security overrides ────────────────────────────────────────────────────────
# glob 9–14.0.1 (GHSA-3g3m-2fjr-6pw4) and minimatch <11.0.1 (GHSA-g3hv-75wg-m249)
# have no backports. minimatch 11 drops `makeRe` and the default export, so the
# two eslint plugins still on them are patched (see patches/). deepmerge <=4.3.1
# (GHSA-gcqx-w48m-w2h4) has no fix at all; its only consumer just deep-clones a
# constant, so it is patched to structuredClone and the package removed.
overrides:
  glob: ^14.0.3
  minimatch: ^11.0.3
  deepmerge: '-'

# allowBuilds: explicit allowlist for packages permitted to run install-time
# build scripts. Only add packages here after reviewing what the script does.
# esbuild  – compiles its Go-based JS bundler binary; required for Vite
# sharp    – compiles its libvips native image-processing binary; required for PWA icon gen
# workerd  – downloads Cloudflare's official Workers runtime binary; required for `wrangler dev`/`deploy`
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

patchedDependencies:
  '@rollup/plugin-node-resolve@16.0.3': patches/@rollup__plugin-node-resolve@16.0.3.patch
  eslint-plugin-import-x@4.17.1: patches/eslint-plugin-import-x@4.17.1.patch
  eslint-plugin-jsx-a11y@6.10.2: patches/eslint-plugin-jsx-a11y@6.10.2.patch
