# pnpm 11+ project settings

packages:
  - '.'
  - 'worker'

# ── Supply-chain protection ───────────────────────────────────────────────────
#
# minimumReleaseAge (minutes): pnpm refuses to install any package version
# published less than N minutes ago. The pnpm 11 default is 1440 (24 h).
# 1440 min = 24 h — gives the ecosystem time to flag hijacked releases while
# still allowing the esbuild security patch (GHSA-gv7w-rqvm-qjhr) to install.
minimumReleaseAge: 1440

# ── Security overrides ────────────────────────────────────────────────────────
# glob 9–14.0.1 (GHSA-3g3m-2fjr-6pw4, AbortSignal bypass), via
# vite-plugin-pwa>workbox-build.
overrides:
  glob: ^14.0.3

# ── Accepted audit advisories ─────────────────────────────────────────────────
# GHSA-gcqx-w48m-w2h4 (low): deepmerge <=4.3.1 prototype poisoning. Build-time
# only, via vite-plugin-pwa>workbox-build>@rollup/plugin-node-resolve. The
# advisory names 4.3.2 as patched, but no such release exists on npm, so no
# override can fix it. Drop once deepmerge publishes a patched release.
#
# GHSA-g3hv-75wg-m249 (moderate): minimatch <11.0.1 glob-pattern DoS. Lint-time
# only (eslint, typescript-eslint, eslint-plugin-*), fed patterns we author.
# Patched 11.x removed `makeRe` and the default export that eslint-plugin-import-x
# and eslint-plugin-jsx-a11y still use, so forcing it breaks `pnpm run lint`.
# Drop once the eslint plugin ecosystem supports minimatch 11.
auditConfig:
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249
    - GHSA-gcqx-w48m-w2h4

# allowBuilds: explicit allowlist for packages permitted to run install-time
# build scripts. Only add packages here after reviewing what the script does.
# esbuild  – compiles its Go-based JS bundler binary; required for Vite
# sharp    – compiles its libvips native image-processing binary; required for PWA icon gen
# workerd  – downloads Cloudflare's official Workers runtime binary; required for `wrangler dev`/`deploy`
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
