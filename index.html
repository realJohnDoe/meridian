    <!-- Status bar colour, as the sRGB hex of the Meridian/Meridian Light
         --background token (the topbar that sits under the status bar; html
         itself paints --backdrop, the letterbox behind the app column, which a
         phone never shows). Keep in sync with src/index.css and the manifest
         theme_color in vite.config.ts.

         These are the fallback layer. ThemeColorSync (routes/__root.tsx)
         inserts a tag ahead of these once React mounts and keeps it on the
         active theme, so all eleven palettes tint the bar wherever the UA
         implements the standard. These three cover what it cannot: the first
         frame before React mounts, JS being unavailable, and — because a parse
         failure advances the algorithm to the next candidate — a synced value
         the UA cannot read. Between them they resolve the two themes that
         `prefers-color-scheme` maps to.

         Order matters: the UA takes the FIRST tag in tree order whose media
         matches, so the unconditional fallback has to come last. That same rule
         is why ThemeColorSync inserts its tag *before* this block rather than
         appending it. -->
    <meta name="theme-color" content="#011227" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e8edf4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#011227" />
